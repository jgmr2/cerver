# nginx/nginx.conf - unica via de entrada: sirve el build de frontend/
# como SPA y reverse-proxea la API al backend (ver docker-compose.yml,
# servicio "backend" ya sin puerto expuesto al host).
#
# Los headers X-Real-IP/X-Forwarded-For que se mandan aca son los que
# utils/http/router.h (extract_forwarded_ip) y utils/auth/auth.c
# (generado por tools/dbfiller) leen cuando TRUST_PROXY_HEADERS=1 -- ver
# ese env var en docker-compose.yml. Confiar en esos headers solo es
# seguro porque el backend deja de ser alcanzable de otra forma que no
# sea a traves de este nginx.
server {
    listen 80;
    server_name _;

    # /api/... -- sin slash final en proxy_pass: preserva el path
    # completo tal cual llego (los handlers del backend ya esperan
    # "/api/...", no algo recortado).
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger UI -- si el backend se compilo con el target "runtime-prod"
    # (ver Dockerfile de la raiz, sin docs-ui/), esto simplemente devuelve
    # 404: no hace falta que nginx sepa cual de los dos targets corre.
    location /docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Assets versionados del build de Vite (frontend/dist/assets/,
    # nombres con hash tipo index-XXXX.js) -- 404 REAL si falta uno, a
    # proposito: antes de este location, un asset roto (build viejo
    # referenciando un hash que ya no existe) caia en el location / de
    # abajo y devolvia 200 con el HTML del placeholder en vez de un 404
    # que delate el problema.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Resto de los estaticos del frontend + fallback SPA: cualquier ruta
    # de la APP (no un asset de arriba) que no matchee un archivo real
    # cae en index.html para que el router client-side de turno la
    # resuelva (y decida el 404 propio de la app, si corresponde).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
