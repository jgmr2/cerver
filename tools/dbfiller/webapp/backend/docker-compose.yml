services:
  dbfiller-web:
    build:
      # Contexto = tools/dbfiller/ (no webapp/backend/): el Dockerfile
      # necesita ver tanto webapp/backend/ como src/ (dbfiller_core/ son
      # symlinks relativos hacia src/, ver ese directorio y el
      # comentario grande en el Dockerfile). dockerfile: se indica
      # explicito porque ya no esta en la raiz del contexto.
      context: ../..
      dockerfile: webapp/backend/Dockerfile
    # network_mode: host (no "ports:", son incompatibles) -- dbfiller-web
    # necesita alcanzar "localhost:<puerto>" de servicios que el propio
    # usuario levanta con docker-compose en el host (mismo motivo que ya
    # usaba --network=host en los `docker run ... psql` de la vieja GUI
    # GTK4), y de paso queda expuesto en localhost:${PORT} sin mapeo
    # explicito.
    network_mode: host
    environment:
      - PORT=${PORT:-8090}
      # A proposito SIN DATABASE_URL/JWT_SECRET: dbfiller-web no usa el
      # pool ni el sistema de auth del framework (ver el comentario
      # grande en config/db.c, init_db()) -- se conecta a bases
      # arbitrarias elegidas en runtime via /api/connect.
    # io_uring_queue_init() necesita esto -- mismos requisitos que ya
    # documentaba el docker-compose.yml estandar generado por
    # scaffold_new_project para el proyecto cerver real: el perfil
    # seccomp default de Docker bloquea las syscalls de io_uring
    # (io_uring_setup/io_uring_enter/etc, historicamente restringidas por
    # varias CVEs), y memlock/nofile bajos hacen fallar el anillo con
    # buffers registrados. Sin esto el proceso segfaultea/aborta apenas
    # arranca cada hilo worker (confirmado: exit code 139 en la primera
    # corrida sin estas dos lineas).
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # Docker-outside-of-Docker: los "docker"/"docker compose" que corre
      # dbfiller-web (ver controllers/dbfiller_docker.c) controlan el
      # daemon del HOST -- no anidan uno propio. Da acceso root sobre el
      # host a quien pueda hablarle a este socket; aceptable en una
      # herramienta de desarrollo local de un solo usuario, ver el plan.
      - /var/run/docker.sock:/var/run/docker.sock
      # Arbol de trabajo montado con el MISMO path adentro que afuera,
      # para que "Raiz del repo" (elegida libremente por el usuario en
      # runtime) no necesite ninguna traduccion de rutas entre host y
      # contenedor. Ajustar este mount si el/los repos que se van a
      # apuntar con dbfiller-web viven fuera de este arbol.
      - /run/media/x/x:/run/media/x/x
    restart: unless-stopped
