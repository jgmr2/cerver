services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_socket:/var/run/postgresql  # Aquí se crea el archivo .s.PGSQL.5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Corregido: Sin espacios y usando tus variables exactas
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@/${POSTGRES_DB}?host=/var/run/postgresql
      - UV_THREADPOOL_SIZE=100
    volumes:
      - pg_socket:/var/run/postgresql  # El backend lee el archivo aquí
    depends_on:
      db:
        condition: service_healthy # Espera a que el healthcheck de 'db' pase
    restart: unless-stopped

volumes:
  pgdata:
    name: postgres_data_simple
  pg_socket:
    name: cerver_pg_socket