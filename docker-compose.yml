services:
  db:
    image: postgres:16-alpine
    # COMANDO DE TUNEO CRÍTICO
    command: [
      "postgres",
      "-c", "max_connections=2000",       # Subimos de 100 a 2000
      "-c", "shared_buffers=1GB",         # Aumenta según tu RAM (25% de la RAM total)
      "-c", "effective_cache_size=3GB",   # 75% de la RAM total
      "-c", "work_mem=16MB",              # RAM por cada operación de ordenamiento
      "-c", "maintenance_work_mem=256MB", 
      "-c", "min_wal_size=1GB",
      "-c", "max_wal_size=4GB"
    ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_socket:/var/run/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/sakila:/sakila:ro
    # AJUSTES DE KERNEL PARA LA DB
    sysctls:
      - net.core.somaxconn=4096           # Mayor cola de conexiones TCP
    ulimits:
      nofile:
        soft: 65536                       # Permite miles de archivos abiertos
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s                        # Más rápido para desarrollo
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@/${POSTGRES_DB}?host=/var/run/postgresql
    ulimits:
      memlock: -1
      nofile:                             # EL BACKEND TAMBIÉN NECESITA ESTO
        soft: 65536
        hard: 65536
    security_opt:
      - seccomp:unconfined
    volumes:
      - pg_socket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pg_socket: