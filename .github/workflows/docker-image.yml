name: Deploy Cerver to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # Sustituye con tus secretos de GitHub
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Cambia 'tu-usuario' por tu nombre en Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cerver:latest
          # Esto acelera las compilaciones futuras
          cache-from: type=gha
          cache-to: type=gha,mode=max
