openapi: 3.0.3
info:
  title: cerver API
  description: >
    Documentación de los endpoints expuestos por este backend. Se mantiene
    a mano junto con cada ruta nueva (ver routes/index.h): agregar un
    endpoint significa agregar una línea acá también, mismo criterio que
    el resto del boilerplate — nada se genera solo.
  version: "1.0.0"
servers:
  - url: /
    description: Mismo origen (detrás de nginx, junto al frontend)

tags:
  - name: infra
    description: Health checks, sin lógica de negocio
  - name: auth
    description: >
      Registro, login y verificación de identidad (JWT HS256). Generado por
      tools/dbfiller a partir de la tabla del esquema que sirva para login
      (ver tools/dbfiller/README.md, sección "Autenticación") — el campo
      "username" del body es un nombre fijo del framework, no depende del
      esquema: puede representar un email u otro identificador único, según
      cuál columna se haya detectado.
  - name: ejemplos
    description: Endpoints de plantilla/demostración del boilerplate

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token obtenido de POST /api/auth/login o /api/auth/register.
        Mandar como "Authorization: Bearer <token>".
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    # Punto de insercion de tools/dbfiller: cada tabla generada agrega
    # aca sus propios schemas <Tabla>/<Tabla>Create/<Tabla>Update (ver
    # tools/dbfiller/generate.py). No borrar este comentario.
    # dbfiller:schemas-point

paths:
  /healthz:
    get:
      tags: [infra]
      summary: Liveness check (no toca la base de datos)
      description: >
        Responde 200 en cuanto el proceso esta vivo y atendiendo
        conexiones, sin esperar ningun round-trip a Postgres. Si /healthz
        da 200 y /api no, el problema esta en la DB, no en el proceso.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api:
    get:
      tags: [infra]
      summary: Prueba de vida de la base de datos
      description: Dispara "SELECT current_timestamp" contra Postgres.
      responses:
        "200":
          description: Consulta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  bytes: { type: integer }
                  hex: { type: string }
        "200-error":
          description: "La consulta a la DB fallo (sigue respondiendo 200; ver body)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  e: { type: integer, example: 503 }

  /api/echo/{msg}:
    get:
      tags: [ejemplos]
      summary: Ejemplo de ruta con parámetro de path
      description: >
        No toca la base de datos. Plantilla para cualquier endpoint que
        necesite un identificador en la URL (p.ej. "/recursos/{id}").
      parameters:
        - name: msg
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string }
        "404":
          description: Segmento vacío o con más segmentos de los esperados

  /api/auth/register:
    post:
      tags: [auth]
      summary: Crea un usuario nuevo y devuelve un JWT (auto-login)
      description: >
        El body acepta "username" (el identificador de login que haya
        detectado dbfiller — puede ser un email) y "password", más
        cualquier otra columna que la tabla de auth exija (ver el
        comentario al inicio de utils/auth/auth.c generado, o
        tools/dbfiller/README.md). Esas columnas extra no están fijas: si
        el esquema cambia, correr dbfiller de nuevo actualiza este
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: identificador de login (según el esquema, puede ser un email)
                password:
                  type: string
                  description: mínimo 8 caracteres
                  format: password
      responses:
        "200":
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400":
          description: Body inválido, faltan columnas requeridas o no cumplen el formato
        "409":
          description: El identificador de login ya existe

  /api/auth/login:
    post:
      tags: [auth]
      summary: Autentica un usuario existente y devuelve un JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400":
          description: Body inválido
        "401":
          description: >
            Usuario inexistente o contraseña incorrecta — misma respuesta
            en ambos casos, para no revelar qué usernames existen.

  /api/me:
    get:
      tags: [auth]
      summary: Devuelve los claims del JWT actual
      description: Ruta protegida de ejemplo (get_auth). Plantilla para cualquier endpoint que necesite saber quién es el usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string, description: "id de usuario" }
                  username: { type: string }
        "401":
          description: Token faltante, inválido o vencido

  # Punto de insercion de tools/dbfiller: cada tabla generada agrega aca
  # sus propios paths /api/<tabla> y /api/<tabla>/{id} (ver
  # tools/dbfiller/generate.py). No borrar este comentario.
  # dbfiller:paths-point
